name: CD Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Cible de déploiement'
        required: true
        type: choice
        options:
          - staging
          - production
      image_tag:
        description: 'Tag d’image GHCR (latest, v1.0.0, sha-abc1234…)'
        required: true
        default: latest
      run_seed:
        description: 'Seed comptes + import si base vide'
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: cd-deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy → ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve images
        id: images
        run: |
          OWNER_LC="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "backend=ghcr.io/${OWNER_LC}/carburflow-backend:${{ inputs.image_tag }}" >> "$GITHUB_OUTPUT"
          echo "frontend=ghcr.io/${OWNER_LC}/carburflow-frontend:${{ inputs.image_tag }}" >> "$GITHUB_OUTPUT"

      - name: Copy compose + nginx to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ vars.DEPLOY_SSH_PORT || 22 }}
          source: "docker/docker-compose.prod.yml,docker/nginx/nginx.conf"
          target: "/tmp/carburflow-release"
          overwrite: true

      - name: Pull images & restart stack
        uses: appleboy/ssh-action@v1.2.0
        env:
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          BACKEND_IMAGE: ${{ steps.images.outputs.backend }}
          FRONTEND_IMAGE: ${{ steps.images.outputs.frontend }}
          IMAGE_TAG: ${{ inputs.image_tag }}
          RUN_SEED_FLAG: ${{ inputs.run_seed && '1' || '0' }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          ALLOWED_HOSTS: ${{ vars.ALLOWED_HOSTS }}
          CORS_ALLOWED_ORIGINS: ${{ vars.CORS_ALLOWED_ORIGINS }}
          DB_NAME: ${{ vars.DB_NAME }}
          DB_USER: ${{ vars.DB_USER }}
          SECURE_SSL_REDIRECT: ${{ vars.SECURE_SSL_REDIRECT }}
          GHCR_USER: ${{ secrets.GHCR_USER }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ vars.DEPLOY_SSH_PORT || 22 }}
          envs: DEPLOY_PATH,BACKEND_IMAGE,FRONTEND_IMAGE,IMAGE_TAG,RUN_SEED_FLAG,SECRET_KEY,DB_PASSWORD,ALLOWED_HOSTS,CORS_ALLOWED_ORIGINS,DB_NAME,DB_USER,SECURE_SSL_REDIRECT,GHCR_USER,GHCR_TOKEN
          script_stop: true
          script: |
            set -euo pipefail
            DEPLOY_PATH="${DEPLOY_PATH:-$HOME/carburflow}"
            mkdir -p "$DEPLOY_PATH/nginx"
            cp -f /tmp/carburflow-release/docker/docker-compose.prod.yml "$DEPLOY_PATH/docker-compose.yml"
            cp -f /tmp/carburflow-release/docker/nginx/nginx.conf "$DEPLOY_PATH/nginx/nginx.conf"
            cd "$DEPLOY_PATH"

            umask 077
            cat > .env <<EOF
            CARBURFLOW_BACKEND_IMAGE=${BACKEND_IMAGE}
            CARBURFLOW_FRONTEND_IMAGE=${FRONTEND_IMAGE}
            IMAGE_TAG=${IMAGE_TAG}
            RUN_SEED=${RUN_SEED_FLAG}
            SECRET_KEY=${SECRET_KEY}
            ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1}
            CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:5174}
            DB_NAME=${DB_NAME:-carburflow}
            DB_USER=${DB_USER:-carburflow}
            DB_PASSWORD=${DB_PASSWORD}
            POSTGRES_PASSWORD=${DB_PASSWORD}
            SECURE_SSL_REDIRECT=${SECURE_SSL_REDIRECT:-false}
            EOF

            if [ -n "${GHCR_TOKEN:-}" ]; then
              echo "$GHCR_TOKEN" | docker login ghcr.io -u "${GHCR_USER:-github}" --password-stdin
            fi

            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f || true

            echo "→ Healthcheck API…"
            ok=0
            for i in $(seq 1 30); do
              if curl -fsS "http://127.0.0.1:8001/api/v1/health/" >/dev/null 2>&1; then
                ok=1
                break
              fi
              sleep 2
            done
            if [ "$ok" != "1" ]; then
              echo "Healthcheck API échoué"
              docker compose ps
              docker compose logs --tail=100 backend || true
              exit 1
            fi
            echo "Déploiement OK — ${BACKEND_IMAGE} / ${FRONTEND_IMAGE}"
