# Production / staging — images préconstruites (GHCR), pas de build local.
# Usage :
#   export CARBURFLOW_BACKEND_IMAGE=ghcr.io/<owner>/carburflow-backend:latest
#   export CARBURFLOW_FRONTEND_IMAGE=ghcr.io/<owner>/carburflow-frontend:latest
#   docker compose -f docker-compose.yml --env-file .env up -d

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-carburflow}
      POSTGRES_USER: ${DB_USER:-carburflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD requis}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - carburflow

  backend:
    image: ${CARBURFLOW_BACKEND_IMAGE:?CARBURFLOW_BACKEND_IMAGE requis}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DJANGO_SETTINGS_MODULE: core.settings.prod
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY requis}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
      DB_NAME: ${DB_NAME:-carburflow}
      DB_USER: ${DB_USER:-carburflow}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD requis}
      DB_HOST: db
      DB_PORT: "5432"
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5174}
      SECURE_SSL_REDIRECT: ${SECURE_SSL_REDIRECT:-false}
      RUN_SEED: ${RUN_SEED:-0}
    ports:
      - "8001:8001"
    networks:
      - carburflow

  frontend:
    image: ${CARBURFLOW_FRONTEND_IMAGE:?CARBURFLOW_FRONTEND_IMAGE requis}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5174:5174"
    networks:
      - carburflow

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - backend
      - frontend
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - carburflow
    profiles:
      - with-nginx

volumes:
  postgres_data:

networks:
  carburflow:
    driver: bridge
