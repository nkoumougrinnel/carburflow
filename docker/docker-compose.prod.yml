version: '3.9'
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: carburflow
      POSTGRES_USER: carburflow
      POSTGRES_PASSWORD: carburflow
    ports:
      - "5432:5432"

  web:
    image: ghcr.io/<owner>/carburflow:latest
    depends_on:
      - db
    environment:
      DB_HOST: db
      DB_NAME: carburflow
      DB_USER: carburflow
      DB_PASSWORD: carburflow
      DB_PORT: 5432
      ALLOWED_HOSTS: yourdomain.com
    ports:
      - "8001:8001"

  watchtower:
    image: containrrr/watchtower
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: --cleanup --interval 300