version: '3.9'
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: carburflow
      POSTGRES_USER: carburflow
      POSTGRES_PASSWORD: carburflow
    ports:
      - "5432:5432"
  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql://carburflow:carburflow@db:5432/carburflow
    ports:
      - "8000:8000"
