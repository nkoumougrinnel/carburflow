services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: carburflow
      POSTGRES_USER: carburflow
      POSTGRES_PASSWORD: carburflow
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carburflow -d carburflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ..
      dockerfile: docker/backend/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      DJANGO_SETTINGS_MODULE: core.settings.prod
      SECRET_KEY: docker-dev-secret-change-me
      ALLOWED_HOSTS: localhost,127.0.0.1,backend
      DB_NAME: carburflow
      DB_USER: carburflow
      DB_PASSWORD: carburflow
      DB_HOST: db
      DB_PORT: "5432"
      CORS_ALLOWED_ORIGINS: http://localhost:5174,http://127.0.0.1:5174,http://localhost:5173,http://127.0.0.1:5173
      SECURE_SSL_REDIRECT: "false"
      RUN_SEED: "1"
      # RUN_IMPORT_FORCE: "1"  # reset_and_import à chaque démarrage (destructif)
    ports:
      - "8001:8001"

  frontend:
    build:
      context: ..
      dockerfile: docker/frontend/Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8001/api/v1
    depends_on:
      - backend
    ports:
      - "5174:5174"

volumes:
  postgres_data:
