services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: carburflow
      POSTGRES_USER: carburflow
      POSTGRES_PASSWORD: carburflow
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carburflow -d carburflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ..
      dockerfile: docker/backend/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      DJANGO_SETTINGS_MODULE: core.settings.prod
      SECRET_KEY: docker-dev-secret-change-me
      # .ngrok-* = wildcard sous-domaine Django ; TRUST_NGROK ajoute l’hôte exact
      ALLOWED_HOSTS: localhost,127.0.0.1,backend,.ngrok-free.app,.ngrok.app,.ngrok.io,.ngrok-free.dev
      DB_NAME: carburflow
      DB_USER: carburflow
      DB_PASSWORD: carburflow
      DB_HOST: db
      DB_PORT: "5432"
      CORS_ALLOWED_ORIGINS: http://localhost:5174,http://127.0.0.1:5174,http://localhost:5173,http://127.0.0.1:5173
      SECURE_SSL_REDIRECT: "false"
      TRUST_NGROK_ORIGINS: "true"
      USE_X_FORWARDED_HOST: "true"
      SECURE_PROXY_SSL_HEADER: "true"
      RUN_SEED: "1"
      # RUN_IMPORT_FORCE: "1"  # reset_and_import à chaque démarrage (destructif)
    ports:
      - "8001:8001"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import socket; s=socket.create_connection(('127.0.0.1', 8001), 2); s.close()",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 180s

  frontend:
    build:
      context: ..
      dockerfile: docker/frontend/Dockerfile
      args:
        # Chemins relatifs /api/v1 — nginx du conteneur proxy vers backend
        # (requis pour ngrok : un seul port public)
        VITE_API_BASE_URL: ""
    depends_on:
      backend:
        condition: service_healthy
    restart: on-failure
    ports:
      - "5174:5174"

volumes:
  postgres_data:
